[project]
name = "dy3-polaris"
version = "0.1.0"
description = "Dy3+ Polaris 多智能体协同决策系统 - L6 协议基础设施"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "websockets>=13,<14",
    "redis>=5.1,<6",
    "neo4j>=5.20,<6",
    "pymilvus>=2.4,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.30,<1",
    "starlette>=0.37,<1",
    "sse-starlette>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true